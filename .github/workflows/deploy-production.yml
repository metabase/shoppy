name: Production Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Shoppy E2E tests"]
    types:
      - completed
    branches:
      - "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: us-east-1

      - name: Get runner public IP
        id: runner-ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Authorize runner IP on the warehouse security group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ vars.SHOPPY_DB_SECURITY_GROUP_ID }} \
            --protocol tcp --port ${{ vars.SHOPPY_DB_PORT }} \
            --cidr ${{ steps.runner-ip.outputs.ip }}/32

      - name: Ensure that Esno executable is ready
        run: yarn install --cwd api --frozen-lockfile

      - name: Reinitialize Shoppy's DWH DB
        env:
          DB_URL: postgres://${{ secrets.SHOPPY_DB_USER }}:${{ secrets.SHOPPY_DB_PASSWORD }}@${{ secrets.SHOPPY_DB_HOST }}:${{ vars.SHOPPY_DB_PORT }}/${{ vars.SHOPPY_DB }}?sslmode=no-verify
        run: |
          cd api &&
          yarn db:initialize

      - name: Revoke runner IP from the warehouse security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ vars.SHOPPY_DB_SECURITY_GROUP_ID }} \
            --protocol tcp --port ${{ vars.SHOPPY_DB_PORT }} \
            --cidr ${{ steps.runner-ip.outputs.ip }}/32

  deploy-to-vercel:
    needs: [ deploy ]
    uses: ./.github/workflows/deploy-to-vercel.yml
    with:
      vercel-environment: 'production'
    secrets:
      vercel-token: ${{ secrets.VERCEL_SHOPPY_TOKEN }}
      vercel-org-id: ${{ secrets.VERCEL_SHOPPY_ORG_ID }}
      vercel-project-id: ${{ secrets.VERCEL_SHOPPY_PROJECT_ID }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
