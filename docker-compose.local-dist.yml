services:
  metabase:
    volumes:
      # The whole folder is mounted so a missing `metabase.jar` does not fail the bind mount.
      # `metabase/entrypoint.sh` picks the jar up when it is present and falls back to the image's jar otherwise.
      - ./local-dist:/app/local-dist:ro
      - type: bind
        source: ./metabase/metabase_dump.sql
        target: /app/metabase_dump.sql
        read_only: true
        bind:
          create_host_path: false
